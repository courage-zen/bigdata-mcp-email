# Plaintext SMTP submission endpoint — local-smtp-forwarder by default.
# The forwarder handles TLS/auth to the real upstream relay.
smtp:
  host: "127.0.0.1"
  port: 2525
  # Envelope sender for every mail. Configure the forwarder's authenticated
  # account address (or a send-as alias it permits).
  from: "noreply@example.com"

# Per-attachment size cap in MiB (default 10).
# max_attachment_mb: 10

# Optional: restrict recipients to these domains (omit = no restriction).
# Every to/cc/fallback address must be at one of these domains.
# allowed_domains:
#   - "example.com"
#   - "acme.org"

# Server-level settings come from env vars, not this file:
#   MCP_AUTH_KEY  comma-separated bearer keys (unset = no auth, local dev only)
#   MCP_HOST      listen address (default 0.0.0.0)
#   MCP_PORT      listen port   (default 8000)
#   EMAIL_MCP_CONFIG  path to this file (default ./config.yaml)
# SMTP_HOST / SMTP_PORT / SMTP_FROM / MAX_ATTACHMENT_MB override the file;
# ALLOWED_DOMAINS (comma-separated) replaces allowed_domains.
