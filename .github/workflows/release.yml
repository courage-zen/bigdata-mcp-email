name: Release

# Sole owner of version-tag releases: binaries, images, and checksums all
# converge in the publish job, so checksums.txt covers every asset (the
# image-export job used to race in a separate workflow and its tarballs
# missed the checksum file).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./... && go test ./...

  binaries:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build (linux-${{ matrix.arch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags='-s -w' -o email-mcp .
          mkdir -p release
          tar -czf "release/email-mcp-linux-${{ matrix.arch }}.tar.gz" email-mcp
      - name: Smoke test (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          MCP_AUTH_KEY=smoke-key MCP_PORT=8123 SMTP_FROM=smtp@example.com ./email-mcp > server.log 2>&1 &
          server_pid=$!
          for i in $(seq 1 30); do
            curl -s -o /dev/null -X POST http://127.0.0.1:8123/mcp \
              -H "Authorization: Bearer smoke-key" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}},"id":1}' \
              && break
            sleep 1
          done
          response="$(curl -s -X POST http://127.0.0.1:8123/mcp \
            -H "Authorization: Bearer smoke-key" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "X-Multica-User-Email: smoke-user@example.com" \
            -d '{"jsonrpc":"2.0","method":"tools/call","params":{"name":"send-email","arguments":{"subject":"smoke","body":"hi"}},"id":2}')"
          echo "${response}" | grep -q "smoke-user@example.com" || {
            echo "multica_context missing from tool response"; cat server.log; exit 1;
          }
          kill "${server_pid}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  images:
    # Build and push the multi-arch image to ghcr.io (same metadata as the
    # main-branch workflow), then export per-arch tar.gz as artifacts for
    # the publish job.
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export images per arch
        run: |
          tag="${GITHUB_REF_NAME}"   # e.g. v1.0.0
          ref="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${tag}"
          mkdir -p release
          for arch in amd64 arm64; do
            # Pull the arch-specific manifest digest, tag it with a clear name,
            # then save so `docker load` preserves the repository:tag label.
            digest=$(docker buildx imagetools inspect "${ref}" --format "{{range .Manifest.Manifests}}{{if eq .Platform.Architecture \"${arch}\"}}{{.Digest}}{{end}}{{end}}")
            local_tag="email-mcp:${tag}-${arch}"
            docker pull "${ref}@${digest}"
            docker tag "${ref}@${digest}" "${local_tag}"
            docker save "${local_tag}" | gzip > "release/email-mcp-image-${tag}-linux-${arch}.tar.gz"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-image
          path: release/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [binaries, images]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: |
          rm -f checksums.txt
          find . -type f ! -name "checksums.txt" -print0 | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate-release-notes: true
