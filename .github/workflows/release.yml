name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./... && go test ./...

  binaries:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - arch: amd64
          - arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build (linux-${{ matrix.arch }})
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags='-s -w' -o email-mcp .
          mkdir -p release
          tar -czf "release/email-mcp-linux-${{ matrix.arch }}.tar.gz" email-mcp
      - name: Smoke test (amd64 only)
        if: matrix.arch == 'amd64'
        run: |
          MCP_AUTH_KEY=smoke-key MCP_PORT=8123 SMTP_FROM=smtp@example.com ./email-mcp > server.log 2>&1 &
          server_pid=$!
          for i in $(seq 1 30); do
            curl -s -o /dev/null -X POST http://127.0.0.1:8123/mcp \
              -H "Authorization: Bearer smoke-key" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json, text/event-stream" \
              -d '{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"smoke","version":"1"}},"id":1}' \
              && break
            sleep 1
          done
          response="$(curl -s -X POST http://127.0.0.1:8123/mcp \
            -H "Authorization: Bearer smoke-key" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -H "X-Multica-User-Email: smoke-user@example.com" \
            -d '{"jsonrpc":"2.0","method":"tools/call","params":{"name":"send-email","arguments":{"subject":"smoke","body":"hi"}},"id":2}')"
          echo "${response}" | grep -q "smoke-user@example.com" || {
            echo "multica_context missing from tool response"; cat server.log; exit 1;
          }
          kill "${server_pid}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary-linux-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-binary-*
          merge-multiple: true
      - name: Checksums
        working-directory: release-assets
        run: |
          rm -f checksums.txt
          find . -type f ! -name "checksums.txt" -print0 | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate-release-notes: true
